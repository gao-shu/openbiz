name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile
        run: mvn -B -DskipTests compile

      - name: Unit tests (exclude MySQL / RealModel E2E)
        run: mvn -B -Dsurefire.failIfNoSpecifiedTests=false "-Dtest=!*MysqlTest,!RealModelE2ETest" test
